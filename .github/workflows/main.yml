name: Extract Hebrew Strings + Auto-Translate for Review

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'translation_review.json'

jobs:
  extract-translate-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Extract strings using string_extractor_intl
        run: |
          dart pub run string_extractor_intl:extract_strings \
            --input lib \
            --output . \
            --template-arb temp_review.arb \
            --class-name Temp \
            --no-replace

      - name: Convert extraction + auto-translate to review JSON
        run: |
          python3 - << 'EOF'
          import json
          from pathlib import Path
          import subprocess
          import sys

          # Install lightweight translator
          subprocess.run([sys.executable, "-m", "pip", "install", "googletrans==4.0.0-rc1"], check=True)
          from googletrans import Translator
          translator = Translator()

          REVIEW_FILE = Path("translation_review.json")
          ARB_FILE = Path("temp_review.arb")

          if not ARB_FILE.exists():
              print("No strings extracted")
              sys.exit(0)

          arb_data = json.loads(ARB_FILE.read_text(encoding="utf-8"))
          review = {}

          hebrew_range = range(0x0590, 0x05FF + 1)

          for key, value in arb_data.items():
              if key.startswith("@"):
                  continue
              if not any(ord(c) in hebrew_range for c in value):
                  continue
              try:
                  translated = translator.translate(value, src='he', dest='en').text
              except Exception as e:
                  translated = f"[TRANSLATE_FAILED: {str(e)}] {value}"
              review[value] = translated

          if review:
              REVIEW_FILE.write_text(json.dumps(review, ensure_ascii=False, indent=2), encoding="utf-8")
              print(f"Generated review file with {len(review)} Hebrew strings")
          else:
              print("No Hebrew strings found")
          EOF

      - name: Clean up temp
        run: rm -f temp_review.arb

      - name: Commit review file if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add translation_review.json
          git commit -m "chore: update Hebrew → English translation review file" || echo "Nothing to commit"
          git push || echo "No push needed"
